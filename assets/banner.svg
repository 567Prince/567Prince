<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00BFFF;stop-opacity:0.1" />
      <stop offset="50%" style="stop-color:#00BFFF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#00BFFF;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="300" fill="url(#grad)"/>
  
  <!-- Animated Gradient Lines -->
  <rect y="270" width="1200" height="30" fill="url(#accent)">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Decorative Circles -->
  <circle cx="100" cy="50" r="80" fill="none" stroke="#00BFFF" stroke-width="1" opacity="0.1">
    <animate attributeName="r" values="60;90;60" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="250" r="100" fill="none" stroke="#00BFFF" stroke-width="1" opacity="0.1">
    <animate attributeName="r" values="80;110;80" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Text -->
  <text x="600" y="170" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#FFFFFF" text-anchor="middle" filter="url(#glow)">
    PRINCE KUMAR SAW
  </text>
  
  <text x="600" y="220" font-family="Arial, sans-serif" font-size="24" fill="#00BFFF" text-anchor="middle" opacity="0.8">
    Full Stack Web Developer | Open Source Enthusiast
  </text>
</svg>
