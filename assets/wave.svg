<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <path d="M0,100 C300,0 600,150 900,50 C1000,25 1100,75 1200,100 L1200,150 L0,150 Z" fill="url(#waveGrad)">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="
        M0,100 C300,0 600,150 900,50 C1000,25 1100,75 1200,100 L1200,150 L0,150 Z;
        M0,80 C300,150 600,0 900,100 C1000,125 1100,50 1200,80 L1200,150 L0,150 Z;
        M0,100 C300,0 600,150 900,50 C1000,25 1100,75 1200,100 L1200,150 L0,150 Z
      "/>
  </path>
  
  <path d="M0,120 C300,20 600,170 900,70 C1000,45 1100,95 1200,120 L1200,150 L0,150 Z" fill="#00BFFF" opacity="0.1">
    <animate attributeName="d" dur="10s" repeatCount="indefinite"
      values="
        M0,120 C300,20 600,170 900,70 C1000,45 1100,95 1200,120 L1200,150 L0,150 Z;
        M0,100 C300,170 600,20 900,120 C1000,145 1100,70 1200,100 L1200,150 L0,150 Z;
        M0,120 C300,20 600,170 900,70 C1000,45 1100,95 1200,120 L1200,150 L0,150 Z
      "/>
  </path>
</svg>
